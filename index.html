<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andi Davalah's Portfolio</title>
  <link rel="stylesheet" href="style.css?v=10.0">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100vh;
      background-color: #F8F7F3;
      color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      position: relative;
      overflow-x: hidden;
    }

    /* Wrapper utama dinaikkan z-index-nya agar selalu berada di atas background */
    .landing-wrapper {
      padding: 0 32px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      z-index: 10; /* KUNCI: Menjamin tombol link tidak tertutup lapisan apapun */
    }

    /* Header Ringkas */
    .landing-header {
      padding: 36px 0;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #777777;
    }

    /* Stage Tengah */
    .landing-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 0;
      width: 100%;
    }

    /* Judul Sejajar Satu Baris */
    .landing-headline {
      font-size: clamp(24px, 3.4vw, 42px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 48px;
      color: #111111;
      white-space: nowrap;
    }

    /* Container Menu Navigasi */
    .landing-nav-container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 20;
    }

    .landing-nav-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    /* Baris Menu */
    .landing-nav-item {
      width: 100%;
      border-top: 1.5px solid #4a4a4a;
    }

    .landing-nav-item:last-child {
      border-bottom: 1.5px solid #4a4a4a;
    }

    .landing-nav-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
      text-decoration: none;
      color: #1a1a1a !important;
      cursor: pointer; /* Memastikan kursor tangan muncul */
      transition: opacity 0.2s ease;
      width: 100%;
    }

    /* Elemen Panah */
    .landing-nav-link .nav-arrow {
      display: inline-block;
      font-size: 15px;
      font-weight: 400;
      color: #888888;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), color 0.2s ease;
      will-change: transform;
    }

    /* Efek Interaksi / Hover: Teks meredup halus & panah maju ke kanan */
    .landing-nav-link:hover {
      opacity: 0.6;
    }

    .landing-nav-link:hover .nav-arrow {
      color: #111111;
      transform: translateX(6px); /* Panah bergerak ke kanan sejauh 6px */
    }

    /* Footer Bawah */
    .landing-footer {
      padding: 28px 0;
      text-align: center;
      font-size: 12px;
      color: #888888;
      letter-spacing: 0.03em;
    }

    @media (max-width: 900px) {
      .decor-left, .decor-right, .decor-corner-tl, .decor-corner-br {
        display: none;
      }
      .landing-headline {
        white-space: normal;
      }
      /* Hero Container di index.html */
.hero-section {
  width: 100vw;
  min-height: 100vh;
  position: relative;
  
  /* Gambar Desktop default */
  background-image: url('https://lh3.googleusercontent.com/d/1SnmRy7WVk8ZeL8sw1AQLLUnrm6ehwwwW');
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
  
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Opsi: Lapisan penurun kontras agar teks tetap terbaca jelas */
.hero-overlay {
  position: absolute;
  inset: 0;
  background: rgba(248, 247, 243, 0.35); /* Selaras dengan warna krem dasar #F8F7F3 */
  z-index: 1;
}

/* Khusus Layar Handphone (Lebar layar <= 768px) */
@media (max-width: 768px) {
  .hero-section {
    /* Otomatis ganti ke versi vertikal */
    background-image: url('foto-muka-mobile.webp');
    background-position: center top; /* Fokuskan ke wajah bagian atas */
  }
}

}
  </style>
</head>
<body>

  <!-- Background Accents (pointer-events dimatikan total agar tidak mengganggu klik) -->
  <div class="bg-decorations" aria-hidden="true">
    <div class="decor-corner-tl"></div>
    <div class="decor-corner-br"></div>

    <div class="decor-left">
      <div class="decor-circle-lg"></div>
      <div class="decor-label"></div>
    </div>

    <div class="decor-right">
      <div class="decor-label"></div>
      <div class="decor-circle-dual">
        <div class="dual-outer"></div>
        <div class="dual-inner"></div>
      </div>
    </div>
  </div> 

  <div class="landing-wrapper">
    <header class="landing-header">
      Andi Davalah's Portfolio
    </header>

    <main class="landing-center">
      <h1 class="landing-headline">
        Welcome to Andi Davalah's Website
      </h1>

      <nav class="landing-nav-container">
        <ul class="landing-nav-list">
          <li class="landing-nav-item">
            <a href="films.html" class="landing-nav-link">
              <span>Videography & Films</span>
              <span class="nav-arrow">→</span>
            </a>
          </li>
          <li class="landing-nav-item">
            <a href="design.html" class="landing-nav-link">
              <span>Design & Branding</span>
              <span class="nav-arrow">→</span>
            </a>
          </li>
          <li class="landing-nav-item">
            <a href="process.html" class="landing-nav-link">
              <span>Process & Archives</span>
              <span class="nav-arrow">→</span>
            </a>
          </li>
          <li class="landing-nav-item">
            <a href="other-works.html" class="landing-nav-link">
              <span>Other Works & Documents</span>
              <span class="nav-arrow">→</span>
            </a>
          </li>
          <li class="landing-nav-item">
            <a href="contact.html" class="landing-nav-link">
              <span>Contact</span>
              <span class="nav-arrow">→</span>
            </a>
          </li>
        </ul>
      </nav>
    </main>

    <footer class="landing-footer">
      © 2026 Andi Davalah. Selected Works & Archives.
    </footer>
  </div>

</body>
</html>
